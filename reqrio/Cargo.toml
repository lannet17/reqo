[package]
name = "reqo"
version = "0.5.0"
edition = "2024"
readme = "../README.md"
description = "HTTP/1.1 and HTTP/2 client with ordered headers and replaceable TLS (rustls by default)"
license-file = "../LICENSE-APACHE"
repository = "https://github.com/lannet17/reqo"

[dependencies]
reqo-base = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
log = { version = "0.4", default-features = false, optional = true }
tokio = { version = "1", features = ["time", "net", "io-util", "macros", "rt-multi-thread"], optional = true }
# Default TLS backend. Disable default features to plug in your own `TlsConnector`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "sync_http_test"
required-features = ["serde"]

[[test]]
name = "async_http_test"
required-features = ["aync", "serde"]

# Shared modules of the tests above (Cargo also builds them as their own targets).
[[test]]
name = "sync_http"
required-features = ["serde"]

[[test]]
name = "async_http"
required-features = ["aync", "serde"]

[[example]]
name = "async_h1"
required-features = ["aync"]

[features]
default = ["rustls", "zstd"]
# `Response::json::<T>()`, `Body::json(&T)` and serde derives.
serde = ["dep:serde", "dep:serde_json"]
rustls = ["dep:rustls", "dep:webpki-roots"]
aync = ["dep:tokio", "dep:tokio-rustls"]
log = ["dep:log"]
zstd = ["reqo-base/zstd"]
# HTTP/3 is not available with the pluggable TLS layer yet.
quic = []
