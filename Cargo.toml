[workspace]
resolver = "1"
members = [
    "base",
    "reqrio",
]
exclude = ["reqtls"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
reqrio-json = { path = "json", version = "0.1.13" }
reqo-base = { path = "base", version = "0.5.0" }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
#panic = "abort"
incremental = false