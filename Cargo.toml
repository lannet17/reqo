[workspace]
resolver = "1"
members = [
    "base",
    "reqrio",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
reqo-base = { path = "base", version = "0.5.0", default-features = false }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
#panic = "abort"
incremental = false