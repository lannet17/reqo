name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: build (feature combinations)
        shell: bash
        run: |
          cargo build -p reqo
          cargo build -p reqo --no-default-features
          cargo build -p reqo --features aync,serde,log
          cargo build -p reqo --no-default-features --features aync
      - name: unit, local-server and doc tests
        shell: bash
        run: |
          cargo test -p reqo-base --all-features
          cargo test -p reqo --features aync,serde --lib
          cargo test -p reqo --features aync,serde --test docs_local_server_test
          cargo test -p reqo --features aync,serde --doc
      # Network tests (sync_http_test / async_http_test) hit httpbin.reqrio.com and are run manually.
